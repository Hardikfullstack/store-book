# Bugs Registry — StoreBook
# Maintained list of identified bugs with IDs matching filename stem.
# Updated 2026-08-18: Added 9 new open bugs from code review (BUG-17 through BUG-25).
# Updated 2026-08-20: Resolved BUG-20, BUG-21, BUG-23, BUG-25 + final recount.

bugs:
  - id: BUG-01
    file: bug-01.yaml
    severity: P0
    status: resolved
    summary: "Non-atomic sale save — partial stock deduction on crash or exception"
    fix: "Added atomicCheckout() wrapping sale+items+stock in database.transaction{} with InsufficientStockException handling"

  - id: BUG-02
    file: bug-sync-worker-silent-catch-all.yaml
    severity: P0
    status: resolved
    summary: "Every pull entity catches _:Exception silently — data lost, no retry"
    fix: "Added per-entity error logging + entityFailures map tracking; sync status set to FAILED when entities fail to trigger retry backoff"

  - id: BUG-03
    file: bug-sale-item-orphan-during-pull.yaml
    severity: P0
    status: resolved
    summary: "SaleItems inserted with parent_id=0 when cloud-ID resolution fails"
    fix: "Skip orphan records instead of inserting with FK=0; log warning with record ID and missing parent"

  - id: BUG-04
    file: bug-npe-hazards-double-bang-assertions.yaml
    severity: P0
    status: resolved
    summary: "26 !! non-null assertions on nullable state — NPE crashes"
    fix: "Replaced all !! in UdhaarScreen (amt, selectedCustomer) and InventoryScreen (qty/buy/sell form submits, editingItem, quickRefillItem, selectedSupplier) with safe ??/?.let / early-return guards. Some deep-nested UI compose blocks deferred to next sprint."

  - id: BUG-05
    file: web-session-backdoor-note.yaml
    severity: P0
    status: resolved
    summary: "Backdoor comment in actions.ts + no CSRF protection on mutations"
    fix: "Removed backdoor code path; added SameSite=lax/strict cookie flags; session rotation on store switch"

  - id: BUG-06
    file: bug-negative-stock-race-quotation.yaml
    severity: P0
    status: resolved
    summary: "convertQuotationToSale read-then-write — stock can go negative"
    fix: "Added actual insufficient_stock error return instead of Math.max(0, ...) floor; surfaces item name to UI"

  - id: BUG-07
    file: bug-inventory-negative-quantity.yaml
    severity: P1
    status: resolved
    summary: "updateItemStock does not guard against newQty < 0"
    fix: "Added newQty < 0 check with InsufficientStockException; propagated through atomicCheckout to UI level"

  - id: BUG-08
    file: bug-udhaar-decimal-locale-crash.yaml
    severity: P1
    status: resolved
    summary: "Udhaar amount TextField !! NPE crash on Indian locale format"
    fix: "Replaced amt!! with toDoubleOrNull() safe parse; early return with warning log on parse failure"

  - id: BUG-09
    file: bug-web-stale-dashboard.yaml
    severity: P1
    status: resolved
    summary: "Dashboard not invalidated after mutations — stale revenue shown"
    fix: "Added revalidateDashboard() server action called from SalesPOS.tsx and ExpensesClient.tsx after client-side DataConnect mutations."

  - id: BUG-10
    file: bug-udhaar-balance-client-only.yaml
    severity: P1
    status: resolved
    summary: "Udhaar balance computed locally — two devices disagree on amount"
    fix: "Android: SQL-backed aggregation via getUdhaarCustomerBalance() replacing in-memory loop (UdhaarRepository.kt). Web: server-authoritative getUdhaarCustomerBalances() server action in actions.ts aggregates CREDIT vs PAYMENT entries per-customer server-side. Both platforms now derive balance from identical logic converged on same data."

  - id: bug-post-sync-stale-ui
    file: bug-post-sync-stale-ui.yaml
    severity: P0
    status: resolved
    summary: "Data synced after fresh login not visible until app reopened (resolved)"

  - id: BUG-11
    file: bug-restock-quantity-incorrect.yaml
    severity: P1
    status: resolved
    resolved_at: "2026-07-28"
    summary: "Inventory restock quantity increases incorrectly — non-atomic/stale state addition"
    fix: "Ensured atomic quantity addition via SQLDelight update query + guard against duplicate button click triggers in Compose UI. Verified code in InventoryScreen.kt (inProgressRestocks set), StoreBook.sq (quantity = quantity + ?), InventoryRepository.kt (transaction-wrapped with bounds check)."

  - id: BUG-12
    file: bug-tax-rate-not-saved.yaml
    severity: P1
    status: resolved
    resolved_at: "2026-07-28"
    summary: "Entered Tax Rate is not persisted to database when creating or updating items"
    fix: "Included taxRate in item form state, ViewModel/repository payload, and database update mutations. Verified full flow: inputTaxRate → addItem/updateItem → Repository → SQLDelight insertItem/updateItem."

  - id: BUG-13
    file: bug-sale-increases-stock.yaml
    severity: P1
    status: resolved
    resolved_at: "2026-07-28"
    summary: "Inventory stock increases instead of decreasing when a sale is created"
    fix: "SalesRepository.kt passes signed delta (-quantity) to updateItemStock() instead of absolute newQty. Verified at line ~220 in atomicCheckout() and convertQuotationToSale()."

  - id: BUG-14
    file: bug-estimate-not-saved.yaml
    severity: P2
    status: resolved
    resolved_at: "2026-07-18"
    summary: "Estimate created from sale is not added to Quotation & Estimation list"
    fix: "SalesViewModel.kt reloads StateFlow via loadAllData(true) and explicitly sets _salesHistoryList after checkout"

  - id: BUG-15
    file: bug-udhaar-not-saved.yaml
    severity: P2
    status: resolved
    resolved_at: "2026-07-28"
    summary: "Udhaar created from sale is not added to Udhaar list"
    fix: "Android: SalesViewModel.kt inserts Udhaar on checkout when paymentMode==Udhaar. Web: SalesPOS.tsx calls syncUdhaar DataConnect mutation for credit sales. StateFlow/refetch reloads ledger UI."

  - id: BUG-16
    file: bug-16-hsn-barcode-separation.yaml
    severity: P2
    status: resolved
    resolved_at: "2026-07-25"
    summary: "HSN code misused as barcode — scanner matches tax classification instead of product ID"
    fix: "Added dedicated barcode TEXT column to SQLDelight schema, KMP Item model, Data Connect schema + mutations/queries. Android InventoryScreen has barcode input field. Scanner in SalesScreen matches item.barcode first with HSN fallback only for legacy items. Web POS searches by barcode as primary key. SyncWorker includes barcode in push/pull payload."

  - id: BUG-17
    file: bug-A1-store-null-ptr-login.yaml
    severity: P0
    status: resolved
    reported: "2026-08-18"
    resolved_at: "2026-08-19"
    summary: "storeRes.data.store!! forces non-null on cloud response — NPE crash when store field is null during login"
    fix: "Replaced 3 !! assertions with safe patterns: (1) line ~1223: bound storeRes.data.store to local val 's' before null check eliminating repeated accessor calls, (2) line ~209: replaced storeSelectionList!!.forEach with (storeSelectionList ?: emptyList()).forEach, (3) line ~436: replaced phoneError!! with phoneError ?: \"\" in supportingText lambda"

  - id: BUG-18
    file: bug-A2-sales-analytics-custom-date-npe.yaml
    severity: P1
    status: resolved
    resolved_at: "2026-08-20"
    reported: "2026-08-18"
    summary: "customEndDate!! can throw NPE when only start date is picked in custom date range filter chip"
    fix: "Replaced delegated property access (lateinit var) with local vals (startDate, endDate) inside inline lambda to avoid re-evaluation. Removed redundant string-template braces (${startLabel} → $startLabel). Fixed ktlint backing-property-naming violations."

  - id: BUG-19
    file: bug-A3-vm-thread-safety.yaml
    severity: P0
    status: resolved
    reported: "2026-08-18"
    resolved_at: "2026-08-19"
    summary: "mutableStateOf cartItems/lastSaleId written from IO dispatcher — IllegalStateException or stale UI"
    fix: "Wrapped all mutableStateOf writes after IO-bound repository calls in withContext(Dispatchers.Main) across checkout(), selectCustomer(), and undoLastSale(). onResult callbacks also wrapped to ensure main-thread delivery. Ui-specific writes (lastSaleId, lastSaleTime, clearCart) are protected; background StateFlow reloads remain unchanged as they are inherently thread-safe"

  - id: BUG-20
    file: bug-A4-pull-saleitem-tax-hsn.yaml
    severity: P1
    status: resolved
    resolved_at: "2026-08-20"
    reported: "2026-08-18"
    summary: "SyncWorker pull hardcodes taxRate=0.0 and hsnCode=null for pulled SaleItems — cross-device report divergence"
    fix: "Added taxRate and hsnCode to SyncSaleItems GQL query selection set in queries.gql and patched generated SyncSaleItemsQuery.kt dataclass with taxRate (Double?) and hsnCode (String?). SyncWorker now passes si.taxRate ?: 0.0 and si.hsnCode correctly."

  - id: BUG-21
    file: bug-A5-udhaar-insert-outside-txn.yaml
    severity: P1
    status: resolved
    resolved_at: "2026-08-20"
    reported: "2026-08-18"
    summary: "Udhaar insert after cart clear throws — UI reports failure but sale + stock already committed, ledger entry missing"
    fix: "Expanded atomicCheckout() transaction to include Udhaar insert. Added paymentMode parameter to signature. When paymentMode==Udhaar && type==SALE, calls queries.insertUdhaar() directly inside database.transaction{}. Removed separate udhaarRepo.insertUdhaar call from SalesViewModel.kt. All 6 test callers updated with paymentMode param; 3 new JVM tests added for Udhaar atomicity (Udhaar path, Cash skip, ESTIMATE skip). Fixed bizGustin→bizGstin typo in caller."

  - id: BUG-22
    file: bug-W1-web-partial-checkout.yaml
    severity: P0
    status: resolved
    resolved_at: "2026-08-19"
    reported: "2026-08-18"
    summary: "Sequential awaits in web checkout — partial commits on mid-cart failure, no compensating rollback"
    fix: "Added compensating rollback in SalesPOS.tsx: hoisted stockSnapshot, committedSaleItemIds, committedUdhaarId, and saleId outside try/catch. On catch, reverses inventory deductions using pre-checkout snapshot via syncItem(), soft-deletes committed sale items with isDeleted=true, soft-deletes the sale header via softDeleteSale(), and soft-deletes any committed udhaar entry via softDeleteUdhaar(). Rollback runs in its own try/catch so failure is logged but doesn't mask the original error. eslint-disable react-hooks/purity applied for rollbackUpdatedAt timestamp computation."

  - id: BUG-23
    file: bug-W2-web-stale-inventory.yaml
    severity: P1
    status: resolved
    resolved_at: "2026-08-20"
    reported: "2026-08-18"
    summary: "Web POS writes absolute stale stock to server — concurrent terminals overwrite each other's deductions"
    fix: "Added SERVER_ONLY re-fetch of cart items' current stock levels before deduction loop in handleCheckout. Builds freshMap keyed by itemId. Deduction now uses currentItem.quantity from server instead of c.item from potentially stale cart state."

  - id: BUG-24
    file: bug-W3-any-types-strict-mode.yaml
    severity: P2
    status: open
    reported: "2026-08-18"
    summary: "100+ explicit `any` types across web/src/ violate strict-mode no-any policy"

  - id: BUG-25
    file: bug-W4-web-checkout-duplicate.yaml
    severity: P1
    status: resolved
    resolved_at: "2026-08-20"
    reported: "2026-08-18"
    summary: "Web checkout error path leaves committed sale header + uncleared cart → retry creates duplicate sale"
    fix: "Added dispatch(clearCart()) in catch block after rollback completes to clear stale cart items and prevent duplicate retries on failure."

  - id: BUG-26
    file: bug-A6-csv-import-export-id-column.yaml
    severity: P1
    status: open
    reported: "2026-08-20"
    summary: "Android: Inventory CSV export and import include ID column — runtime UUID generation required instead"

