|---|---|---|
| SQLDelight (shared) | `StoreBook.sq` | Add `barcode TEXT UNIQUE`, update insert/update/search queries |
| KMP Model (shared) | `Models.kt` | Add `val barcode: String? = null` to Item data class |
| Data Connect schema | `schema.gql` | Add `barcode: String @col(name: "barcode")` to Item type |
| Data Connect mutations | `mutations.gql` | Add `$barcode` variable to syncItem/upsertItem |
| Data Connect queries | `queries.gql` | Include `barcode` in item selections, add barcode search filter |
| Android ViewModel | `InventoryViewModel.kt` | Pass barcode param through insert/update |
| Android Screen | `SalesScreen.kt` | Match scanned code against `item.barcode` |
| Android Screen | `InventoryScreen.kt` | Add barcode input field in advanced options |
| Android SyncWorker | `SyncWorker.kt` | Sync barcode field in push/pull |
| Web ItemsClient | `ItemsClient.tsx` | Add barcode input to form state and formData |
| Web SalesPOS | `SalesPOS.tsx` | Match barcode scan against `item.barcode` |
| Web InvoicePdf | `InvoicePdfGenerator.ts` | No change (HSN remains for invoice) |
