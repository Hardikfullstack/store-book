# BUG-16: HSN Code Misused as Barcode — Scanner Matches Tax Classification Instead of Product ID

## Problem
HSN (Harmonized System of Nomenclature) code is a **GST tax classification** used for invoicing and filing returns. It should NOT be used as the product identifier for barcode scanning. Currently, the Android scanner (`SalesScreen.kt:1165`) matches scanned input against `item.hsnCode`, and the web POS fallback search also includes HSN. This is incorrect because:
- HSN codes are shared across many products (e.g., "1001" for rice applies to brands)
- Barcodes are unique per SKU/product

## Fix Plan
Introduce a new `barcode` field (`TEXT`, nullable, `UNIQUE` constraint for store scoping) in the items table. Route:
- **Barcode scanner input** → match against `barcode` field
- **HSN code** → billing invoice generation and GST reporting only

## Affected Files
