# Bug — Post-Login Sync Data Not Visible Until App Restart

id: bug-post-sync-stale-ui
title: "Data synced after fresh login not visible until app reopened 3-4 times"
severity: P0
status: resolved
reported: "2026-07-14"
component: [SyncWorker, ViewModelFactory, AppNavigation]

root_cause: >
  SyncWorker.performSync() creates its OWN SQLiteDriver instance to write pulled data.
  But all ViewModels are created at the top of AppNavigation() via AppViewModelFactory,
  which lazily opens a SEPARATE database connection. After sync completes and navigation
  to Dashboard happens, DashboardViewModel.loadAllData() queries its own DB connection
  which doesn't see the WAL-journaled writes from SyncWorker's connection until the DB
  file is fully closed and reopened (which happens on app restart).
  
  Additionally, the ViewModelFactory captures `storeId` at construction time via lazy —
  if the factory is created before auth sets the correct `active_store_id`, it may open
  the wrong database file entirely.

fix_approach: >
  Instead of attempting to refresh data from a potentially stale or incorrectly mapped
  AppViewModelFactory, the onAuthSuccess and switchStore callbacks now completely restart
  the MainActivity using Intent.FLAG_ACTIVITY_CLEAR_TASK and explicitly clear the 
  viewModelStore. This guarantees that all ViewModels, Repositories, and the SQLiteDriver
  are instantiated fresh against the correct, freshly-synced storebook_<storeId>.db.

affected_screens:
  - DashboardScreen (shows stale empty data)
  - InventoryScreen (shows empty list)
  - SalesScreen (shows no sales history)
  - UdhaarScreen (shows no entries)
