# Bug — Udhaar amount input crashes with !! on Indian locale decimal separator mismatch

id: bug-udhaar-decimal-locale-crash
title: "Udhaar amount TextField !! NPE crash on Indian numeric keyboard format"
severity: P1
status: resolved
reported: "2026-07-14"
component: [UdhaarScreen]

root_cause: |
  UdhaarScreen uses KeyboardType.Number for the amount input. In Hindi locale,
  some devices present a comma-dotted separator instead of period (.). When users enter '123.45', some devices truncate to "123" or leave string empty entirely if parsing fails.

  The confirm button calls:
      viewModel.recordUdhaarEntry(name, amt!!, ...)
  and amt is null → NPE crash. This happens most during device rotation when state resets but user has entered input.

fix_approach: |
  1. Switch KeyboardType.Number → KeyboardType.Decimal for proper numeric keyboard
  2. Replace amt!! with safe handling:
     val parsedAmount = amountInput.toDoubleOrNull() ?: run { showError(); return }
  3. Add input filter regex [0-9.,]+ via TextField keyboard type to reject non-numeric characters early

affected_screens:
  - UdhaarScreen (crash on confirm with decimal amounts)
  - Dashboard screen (amount recorded as wrong value if truncated before crash)
