# Bug — Estimate Entry Not Saved

id: bug-estimate-not-saved
title: "Estimate created from sale is not added to Quotation & Estimation list"
severity: P2
status: defined
reported: "2026-07-22"
component: [SaleScreen, EstimateViewModel, EstimateRepository]

issue: |
  When a user creates an Estimate from the sale flow, the estimated entry is not being added to the Quotation & Estimation section in the app.

expected_behavior: >
  When an Estimate is successfully created from a sale, it should be saved to the database and immediately appear in the Quotation & Estimation list.

actual_behavior: >
  The Estimate is not added to the Quotation & Estimation list, suggesting it might not be saving correctly to the local database or the list is not refreshing.

root_cause: >
  Pending investigation. Possible causes include missing database insert call when saving an Estimate as opposed to a regular sale, or the Estimates list UI is not correctly observing the database changes.
