### v1.4.0 — Financial Accuracy (Target: after v1.3.0)

epics: [e03]
focus: >
  Ensure all money-related data is correct and auditable. Profit calcs, udhaar
  balances, quotation conversion — shop owners rely on these for business decisions.

stories_included:
  - "e03-s1: SaleItem price snapshot correctness verification"
  - "e03-s2: Udhaar balance recalculation with running total display"
  - "e03-s3: Daily/Monthly aggregate views for Expenses and Sales"
  - "e03-s4: Quotation → Sale conversion preserves line items"

gate_criteria:
  - "All sale amounts sum correctly for sample test dataset (100+ transactions)"
  - "Udhaar balance matches manual calculation within ₹0.01 tolerance"
  - "Quotation-to-sale tested with 5+ edge cases (empty quote, all items deleted item, etc.)"

estimated_effort_m: ~6-8

