## Cadence & Process

release_cadence: every_2_weeks (target, blocked by quality gates)
branch_strategy: direct_to_master_with_tag (solo dev workflow per state.yaml workflow_mode: solo-git)
pre_release_checklist:
  - "specs/planning-status.yaml updated"
  - "Pre-flight green (lint + build)"
  - "All stories in release epic marked done"
  - "Git tag vN.M.0 created with changelog"

rollback_strategy: >
  For each major version, keep one rollback branch (release/vN.N.0). If critical bug found within 48h of release,
  revert to prior branch + cherry-pick fix if simple, else patch on new minor (vN.M+1.0).
