# Release Plan — StoreBook Inventory Management Platform

release_plan_doc: RP1.0
last_updated: "2026-07-28"

### v1.3.0 — Foundation Hardening (Shipped)

epics: [e01, e02]
status: shipped
shipped_date: "2026-07-20"
focus: >
  Make the critical path (sync + inventory CRUD) reliable and crash-resistant.
  This is the highest value because data divergence between devices and dashboard
  directly causes customer trust erosion.

stories_included:
  - "e01-s1: Audit SyncWorker push phase error handling"
  - "e01-s2: Exponential backoff retry for failed mutations"
  - "e01-s3: Pull phase conflict resolution (last-write-wins)"
  - "e01-s4: Sync progress indicator in Android UI"
  - "e02-s1: Wrap Item CRUD in SQLite transactions"
  - "e02-s2: Low-stock threshold alert in ExpiryCheckWorker"

gate_criteria:
  - "Pre-flight: web lint + build passes (npm run lint && npm run build)"
  - "Android assembleDebug builds with zero compile errors"
  - "No new crashes in existing screens during QA walkthrough"
  - "SyncWorker tested offline → online transition scenario manually"

estimated_effort_m: ~8-10

---

### v1.3.2 — Test Automation & Stability Guardrails (Target: after v1.3.1 Verifications)

epics: [e30, e31, e32]
focus: >
  Establish a comprehensive automated testing strategy to prevent future regressions.
  This includes UI Snapshot testing for layout stability, Unit testing for ViewModel/Flow
  and SQLDelight queries, and a CI/CD pipeline to block broken PRs.

stories_included:
  - "e30-s1: Configure UI Snapshot Testing framework"
  - "e30-s2: Capture Baseline Snapshots for Core Screens"
  - "e31-s2: Test SQLDelight Queries in Memory"
  - "e31-s3: Test ViewModel Business Logic (Turbine/MockK)"
  - "e32-s2: Set up GitHub Actions Workflow for CI/CD"

gate_criteria:
  - "GitHub Action runs successfully on PR creation"
  - "At least 4 core screens have passing Paparazzi/Roborazzi snapshot baselines"
  - "Dashboard and Sales ViewModel unit tests achieve 80%+ coverage on business logic"

estimated_effort_m: ~5-7

