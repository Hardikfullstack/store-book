# Spec: Offline-to-Pro Stage 1 Registration Module
feature: "App Registration Module & Stage 1 Offline Store Initialization"
date: "2026-09-25"
status: "completed"

objective: >
  Implement the Stage 1 Registration module in the Android app according to the
  "Offline-to-Pro Plan Data Flow" document. Enable new users to register their store
  with a business name and mobile number, provision a Free plan account with UUID
  primary keys and local sync metadata, while allowing existing owners to log in
  (Owner Login) and staff to access their assigned store (Staff Login).

flow:
  first_launch:
    step_1: "Splash screen checks if onboarding is completed."
    step_2: "If onboarding is false, navigate to Auth/Register screen."
  tabs:
    - "Register"
    - "Owner Login"
    - "Staff Login"
  registration:
    inputs:
      - "Store / Business Name (Required)"
      - "Owner Name (Optional)"
      - "Mobile Phone Number (10 digits, +91)"
    verification:
      - "Firebase Phone Authentication OTP"
    provisioning:
      - "Generate device UUID for storeId"
      - "Sync store record to DataConnect with provided storeName and isPremium = false"
      - "Sync user record to DataConnect with role = 'owner', plan = 'FREE', status = 'active', and optional username"
      - "Save local EncryptedPrefs: active_store_id, business_name, owner_name (if provided), app_mode = 'OFFLINE', onboarding_completed = true"
  owner_login:
    inputs:
      - "Mobile Phone Number (10 digits, +91)"
      - "OTP verification"
    outcome:
      - "If user has stores in DataConnect, display store selection or activate existing store and persist active business_name"
  staff_login:
    inputs:
      - "Staff Phone / Credentials"
      - "Store Code verification"
