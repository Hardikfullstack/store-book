## BOUNDARIES & CONVENTIONS (enforced by codebase)

boundaries:

  multi_tenancy:
    rule: "Every DB query/mutation MUST filter or scope by storeId"
    enforcement: "@auth(level: USER)" in Data Connect queries, StoreBookDbHelper stores on Android

  offline_tolerance:
    rule: ">
      Android app MUST function fully without network. SyncWorker is periodic, not
      synchronous-per-action."
    enforcement: All CRUD goes to local SQLite first; sync is deferred

  id_generation:
    rule: "UUIDs generated client-side (uuidV4 in Data Connect default)"
    reason: Allows offline item creation without cloud call

  data_retention:
    rule: "isDeleted soft-delete on Items, SaleItems, Udhaar — never hard delete"
    reasoning: Audit trail for financial transactions; can be reviewed later

  ad_monetization:
    rule: "AppOpenAds shown on Android free tier (MobileAds init in StoreBookApplication)"
    note: Ads disabled for subscribed users per subscriptionStatus check
