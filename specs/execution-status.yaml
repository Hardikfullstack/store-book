  - complete: "E20-S2 — Restore from Cloud Backup on New Device",
    notes: |
      Back up Manager extended with:
        - fetchLatestBackupInfo() Flow<BackupInfo?>: lists Firebase Storage backups/{storeId} dir,
          returns most recent file's name, timestamp, size, and MD5 checksum.
        - restoreFromCloud() Flow<RestoreState>: downloads latest backup to temp file,
