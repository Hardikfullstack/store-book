epic_id: e47
title: "Web: Suppliers Module — Supplier Ledger Directory & Net Payable Summary"
priority: P1
status: defined
target_version: v1.9.0
description: |
  Comprehensive Supplier Directory and Ledger Hub on the Web Dashboard (/suppliers), replicating the core
  supplier discovery, outstanding net balances, and transaction sorting features from the Android POS app
  (SupplierLedgerScreen.kt). Enables store owners to track all suppliers, inspect real-time pending payable vs.
  advance balances, search by supplier name, and sort by transaction timestamps.

scope:
  in:
    - Dedicated Web UI at /suppliers featuring:
        - Header Metric Cards: Total Net Payable to Suppliers - (sum of all suppliers with positive net balance), Total Supplier Count, and Advance Balance aggregates.
        - Realtime Search Filter: Search query filtering suppliers by name dynamically.
        - Sorting Controls: Sort suppliers by timestamp (latest transaction / creation date), alphabetical (A-Z / Z-A), and highest outstanding payable balance.
        - Supplier Directory Table & Cards:
            - Supplier Name & Avatar Initial
            - Phone Number & quick contact link
            - GSTIN (if registered)
            - Address
            - Outstanding Net Balance Badge (Pending Payable in coral/red, Advance Balance in emerald/green, Settled in gray)
            - Last Transaction Timestamp
            - Action column with dedicated action triggers
        - Empty states for no suppliers created and no search match results.
  out:
    - Supplier creation and payment modal flows (covered in e48).
    - Purchase invoice item creation (covered in e16).

architecture:
  web_components:
    - name: "SuppliersClient (/suppliers)"
      file: "web/src/app/suppliers/SuppliersClient.tsx"
      role: "Main interactive page managing supplier balances, realtime searching, timestamp sorting, and net payable summary calculations."
    - name: "SupplierSummaryCards"
      file: "web/src/components/suppliers/SupplierSummaryCards.tsx"
      role: "Renders top summary metrics including Total Net Payable to Suppliers and Advance balances."
    - name: "SupplierTable"
      file: "web/src/components/suppliers/SupplierTable.tsx"
      role: "Renders directory list of suppliers with status badges, contact info, and action triggers."

stories:
  - id: e47-s1
    title: "Web: Suppliers Directory Page & Top Net Payable Summary Card"
    acceptance:
      - "Route /suppliers displays top summary banner showing Total Net Payable to Suppliers matching Android calculation (sum of netBalance > 0)."
      - "Fetches suppliers and purchases from DataConnect and computes net balance per supplier (Total Purchases - Total Payments)."
      - "Displays total active suppliers count and advance balances."

  - id: e47-s2
    title: "Web: Supplier Listing Table with Contact Details & Balance Status"
    acceptance:
      - "Renders table listing Supplier Name, Phone Number, GSTIN, Address, and Net Balance."
      - "Displays balance in distinct color styles: Red/Coral for Pending Payable, Green/Emerald for Advance Balance, and Gray for Zero/Settled."
      - "Provides empty state when no suppliers are registered."

  - id: e47-s3
    title: "Web: Real-time Search by Supplier Name & Timestamp Sorting"
    acceptance:
      - "Search input filters suppliers by name instantaneously."
      - "Sort dropdown allows ordering by Timestamp (latest activity), Name (A-Z), and Outstanding Balance (Highest to Lowest)."
      - "Handles search query clearing smoothly."
