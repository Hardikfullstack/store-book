epic_id: e47
title: "Web: Suppliers Module — Supplier Listing, Filters & Backend Pagination"
priority: P1
status: complete
target_version: v1.9.0
description: |
  Supplier module for Web (/suppliers) matching the Android app: supplier directory listing,
  filters (search by supplier name and sort by timestamp), top summary card showing Total Net Payable
  to Suppliers, and backend pagination.

scope:
  in:
    - Dedicated Web UI at /suppliers featuring:
        - Top Metric Card: "Total Net Payable to Suppliers" matching App calculation (sum of net balance where net balance > 0).
        - Supplier Directory Listing:
            - Supplier Name
            - Phone Number
            - GSTIN
            - Address
            - Outstanding Net Balance Status
            - Last Transaction Timestamp
        - Filters:
            - Real-time search filter by supplier name.
            - Sorting by timestamp.
        - Backend Pagination: Server-driven pagination with page navigation controls (10 items per page).
        - Empty states for zero suppliers and no search results.
    - Sidebar navigation entry linking to /suppliers in web/src/components/Sidebar.tsx.
  out:
    - Add/Edit Supplier modal (covered in Epic e48).
    - Record Payment sub-modal and Supplier Ledger modal (covered in Epic e48).

architecture:
  web_components:
    - name: "SuppliersPage (/suppliers)"
      file: "web/src/app/suppliers/page.tsx"
      role: "Server component enforcing authentication and rendering SuppliersClient."
    - name: "SuppliersClient (/suppliers)"
      file: "web/src/app/suppliers/SuppliersClient.tsx"
      role: "Main client component managing supplier listing, backend search, timestamp sorting, pagination, and top Net Payable summary card."
    - name: "Sidebar"
      file: "web/src/components/Sidebar.tsx"
      role: "Sidebar navigation linking to /suppliers."

stories:
  - id: e47-s1
    title: "Web: Suppliers Directory Page & Top Net Payable Summary Card"
    acceptance:
      - "Route /suppliers displays top summary card showing Total Net Payable to Suppliers matching App calculation (sum of netBalance > 0)."
      - "Computes net balance per supplier as (Total Purchases - Total Payments)."

  - id: e47-s2
    title: "Web: Supplier Listing with Contact Info & Balance Status"
    acceptance:
      - "Renders directory table listing Supplier Name, Phone Number, GSTIN, Address, and Net Balance Status."
      - "Displays balance in distinct color styles: Red/Coral for Pending Payable, Green/Emerald for Advance Balance, and Gray for Zero/Settled."

  - id: e47-s3
    title: "Web: Search by Supplier Name, Timestamp Sorting & Backend Pagination"
    acceptance:
      - "Search input filters suppliers by supplier name."
      - "Sort controls allow ordering by timestamp."
      - "Backend pagination controls page through suppliers with page indicator and navigation buttons."
