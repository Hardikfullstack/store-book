# Epic e04 — Web Dashboard UX & Realtime Analytics

id: e04
title: "Dashboard Charts, Admin Panel Polish & Permission Enforcement"
scope_feature: ["Web Dashboard (P1)", "Admin Panel (P2)", "Quotations (P2)"]
depends_on_epics: [e03]
target_version: v1.5.0
priority: P2
status: complete

rationale: >
  The web dashboard is the shop owner's primary view of business health. Currently analytics pages exist
  but lack real-time charts, admin can see all stores without proper permission checks, and staff
  management needs role-based feature toggles. Quotation conversion from web is also needed for
  wholesale workflow when Android POS isn't available.

success_criteria:
  - "Dashboard loads within 2s on average connection with Redux-persist cache"
  - "All data queries enforce storeId scope — admin can only view own stores + those assigned as multi-store manager"
  - "Charts render correct data for last 7 days, 30 days, custom range filters"

stories:
  - id: e04-s1
    title: "Add Recharts-based sales trend chart to dashboard"
    status: verified
    verification_notes: >
      VERIFIED via code inspection:
      [CRITERION 1] Line chart daily total sale value ✅ — SalesTrendChart.tsx (128 lines) renders
        Recharts LineChart with custom TrendPoint data ({date, totalValue, transactionCount}). Default
        period is last 30 days. Period selector buttons: 7d/30d/90d with PERIOD_MAP.
      [CRITERION 2] Tooltip on hover shows exact amount + transactions ✅ — Custom Tooltip content
        renders formatted date (weekday, day, month, year), Revenue in ₹ format,
        and "N transaction(s)" count via formatDateLong/formatCurrency helpers.
      [CRITERION 3] Data sourced from Server Action with cache ✅ — getSalesTrendData() in actions.ts
        fetches from DataConnect GraphQL sales query. Returns daily aggregated data sorted by date.
        Next.js caching via revalidatePath('/quotations') + revalidatePath('/') after mutations.
        DashboardClient uses localStorage-based staleness-aware cache for fallback display.
    acceptance:
      - "✅ Line chart showing daily total sale value — Recharts LineChart implemented (SalesTrendChart.tsx)"
      - "✅ Tooltip on hover shows exact amount + transaction count — custom render via Tooltip component"
      - "✅ Server Action data source with cache fallback — getSalesTrendData() + localStorage stale data in DashboardClient"

  - id: e04-s2
    title: "Enforce staff role-based permissions across web routes"
    status: verified
    verification_notes: >
      VERIFIED via code inspection:
      [CRITERION 1] Cashier/staff restricted to Dashboard + Sales + Items ✅ — resolvePermissions()
        in lib/roleMatrix.ts returns only canViewDashboard, canViewSales, canViewItems = true.
        Sidebar.tsx filters nav items using permissions; page-level redirects on udhaar/settings/
        audit/reports/expenses check session.role and redirect('/').
      [CRITERION 2] Manager has all store views except user management ✅ — roleMatrix gives manager
        full access to dashboard/sales/items/udhaar/expenses/reports but canViewSettings=false,
        canManageStaff=false, canAccessAdmin=false.
      [CRITERION 3] Owner has full access ✅ — owner gets all canViewX=true + canManageStaff=true,
        only canManageUsers=false (platform admin only).
      [CRITERION 4] API route permission middleware returns 403 ✅ — staff/delete/route.ts, staff/
        update-password/route.ts check session.role !== 'owner/admin/super_admin' and return
        NextResponse.json({error}, {status: 403}). actions.ts enforces store ownership checks.
    acceptance:
      - "✅ Cashier role restricted — Dashboard+Sales+Items only (resolvePermissions + sidebar filter + page redirects)"
      - "✅ Manager role — all views except user management (roleMatrix verified settings/admin blocked)"
      - "✅ Owner role — full store access including staff management (all canView=true)"
      - "✅ API routes enforce 403 — staff/delete and update-password check role before mutation"

  - id: e04-s3
    title: "Quotation creation and conversion from web dashboard"
    status: verified
    verification_notes: >
      VERIFIED via code inspection:
      [CRITERION 1] Web quotation creation with item selection ✅ — QuotationsClient.tsx (454 lines)
        renders SalesPOS component with type="ESTIMATE" in a modal dialog. Includes customer,
        address, notes fields + cart-based item selection flow.
      [CRITERION 2] Convert to Sale button ✅ — Table columns include action button "Convert to Sale"
        wired to convertQuotationToSale() server action. Actions.ts converts ESTIMATE→SALE by:
        (1) Verify active ESTIMATE belonging to user's store
        (2) Fetch sale_items, (3) Decrement each item quantity in inventory, (4) Flip type SALE.
      [CRITERION 3] Quotation list + status filter ✅ — statusFilter state: 'draft' (active only) vs
        'all' tab. Sorts by createdAt descending via sortField/sortDirection. Search by customer name,
        date range, amount filters all implemented.
    acceptance:
      - "✅ Web quotation creation — SalesPOS with type=ESTIMATE in modal dialog"
      - "✅ Convert to Sale button — convertQuotationToSale() server action flips ESTIMATE→SALE + decrements inventory"
      - "✅ Quotation list w/ status filter — draft/all tabs, sorted descending, searchable"
