# Epic e11 — ViewModel State Management & Reactive Flow Verification

id: e11
title: "Verify All 8 ViewModels Expose Correct LiveData/StateFlows to UI"
scope_feature: ["Android POS (P0)", "UI Architecture (P1)"]
depends_on_epics: [e02, e07]
target_version: v1.3.1
priority: P0
status: defined

rationale: >
  The app has 8 ViewModels that drive all UI screens via LiveData/StateFlows. If state management has
  race conditions, stale data exposure, or memory leaks, the entire UX degrades — items not showing after
  creation, totals not refreshing, crash on config change when ViewModel is recreated incorrectly.
  ViewModelFactory currently uses unchecked casts for every ViewModel type.

success_criteria:
  - "Each ViewModel updates UI reactively within 100ms of data mutation"
  - "No stale LiveData emissions — screen always shows latest data from SQLDelight/DB"
  - "Config changes (rotation, keyboard toggle) preserve correct screen state via factory"

stories:
  - id: e11-s1
    title: "Verify DashboardViewModel computes daily totals correctly and reacts to mutations"
    acceptance:
      - "Dashboard shows today's sales count, total sale value, expense count, udhaar count as soon as data loads"
      - "Creating a new sale via SalesScreen → Dashboard totals update automatically without manual refresh"
      - "Low-stock item count refreshed when items change via InventoryScreen"

  - id: e11-s2
    title: "Verify InventoryViewModel list/query reactive updates and filter correctness"
    acceptance:
      - "Adding new Item appears in inventory list within LiveData emission cycle"
      - "Search filters correctly — partial match on item name is case-insensitive"
      - "Deleting (soft-delete) removes item from default list, 'Show Deleted' toggle reveals it"

  - id: e11-s3
    title: "Verify SalesViewModel billing flow maintains correct cart state through mutations"
    acceptance:
      - "Adding items to cart → subtotal updates immediately"
      - "Removing/clearing cart resets totals to zero correctly"
      - "Completing sale (completeSale()) persists and clears cart, emits success status"

  - id: e11-s4
    title: "Verify ViewModelFactory resolves all ViewModel types correctly without cast failures"
    acceptance:
      - "Each ViewModel type (Dashboard, Sales, Inventory, Udhaar, Expense, Purchase, Supplier, More) resolved via class parameter"
      - "No ClassCastException thrown for any ViewModel lookup path"

  - id: e11-s5
    title: "Verify UdhaarViewModel and ExpenseViewModel balance aggregation"
    acceptance:
      - "Udhaar list sorted by highest current balance descending (highest outstanding first)"
      - "Adding payment → that customer's card updates with new balance in UI immediately"
      - "Expense list grouped by date, total per day visible"
