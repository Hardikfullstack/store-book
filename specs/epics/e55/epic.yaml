    title: "Android: Inventory Module Direct DataConnect API Migration"
    acceptance:
      - "InventoryViewModel queries items via StorebookConnectorConnector.instance.getActiveItems passing storeId, search, and pagination."
      - "Item creation and edits execute StorebookConnectorConnector.instance.syncItem directly over DataConnect."
      - "Item deletion executes StorebookConnectorConnector.instance.softDeleteItem directly over DataConnect."
      - "InventoryScreen displays loading shimmer/spinner during network fetch and surfaces error/retry on failure."
      - "Roborazzi snapshots and ViewModel tests updated and passing."

  - id: e55-s2
