epic_id: e55
title: "Web: Custom PDF Generation & Template Management for Estimates & Invoices"
priority: P1
status: in_progress
target_version: v1.9.0
depends_on: [e04, e35]
type: development
verification_date: "2026-09-17"

description: |
  Enables store owners to customize, preview, and generate professional PDF estimates (quotations) and invoices
  directly from the Next.js web dashboard. Provides a real-time invoice template editor with support for store logos,
  custom color accents, GSTIN details, bank transfer/UPI QR codes, signatures, and terms. Integrates with DataConnect
  for store-scoped data fetching and Firebase Storage for branding assets.

scope:
  in:
    - Web Template Settings (`web/src/app/settings/invoice-templates/`):
        - Visual template customization screen with template selector (Standard GST, Modern Minimalist, Thermal 80mm).
        - Branding controls: Logo upload, accent color picker, header/footer text, bank details, terms & conditions, UPI ID.
        - Redux state persistence (`pdfTemplate` slice) & sync with Firebase DataConnect / Firestore `invoice_settings`.
    - Real-Time PDF Preview & Generation (`web/src/lib/pdf/`):
        - Client-side rendering using `@react-pdf/renderer` or `pdf-lib` for instant live preview while editing.
        - Next.js API route `/api/pdf/generate` for server-rendered PDF downloads and email attachments.
        - Multi-tenancy enforcement: strictly scope queries by active `storeId`.
    - Sales & Estimates Integration (`web/src/app/sales/`, `web/src/app/estimates/`):
        - Action buttons on Sale Detail & Estimate Detail pages to "Download PDF", "Print Invoice", and "Send via WhatsApp/Email".
        - Support for both Estimate (Quote) and Tax Invoice document modes with dynamic GST breakdown tables (CGST, SGST, IGST).
  out:
    - Android native printing / ESC-POS printer integration (handled in e56).
    - Payment gateway direct collection links inside PDF (future roadmap).

architecture:
  web_components:
    - name: "TemplateEditorClient & InvoicePreview"
      path: "web/src/app/settings/invoice-templates/TemplateEditorClient.tsx"
      role: "Interactive UI for configuring store branding, colors, fields, and rendering live PDF canvas preview."
    - name: "pdfTemplateSlice"
      path: "web/src/store/slices/pdfTemplateSlice.ts"
      role: "Redux slice for template draft configuration, field toggles, and preset selection."
    - name: "pdfGenerator Engine"
      path: "web/src/lib/pdf/pdfGenerator.ts"
      role: "Generates PDF documents using template schemas, substituting line items, tax totals, and customer details."
    - name: "PDF Generation Route Handler"
      path: "web/src/app/api/pdf/generate/route.ts"
      role: "Server-side endpoint returning PDF streams for direct downloads and email dispatch."

stories:
  - id: e55-s1
    title: "Web Data & Settings: Store Invoice Template Configuration Schema & Redux Slice"
    acceptance:
      - "Define InvoiceSettings schema in DataConnect / Firestore including logoUrl, accentColor, showGst, bankDetails, and terms."
      - "Create Redux pdfTemplate slice to store active store template options with local draft state management."
      - "Store settings API integration complete with strict storeId multi-tenancy validation."

  - id: e55-s2
    title: "Web UI: Real-Time Interactive Template Customizer & Branding Editor"
    acceptance:
      - "Build TemplateEditorClient screen in web dashboard under Settings > Invoice Templates."
      - "Support uploading store logo and signature image to Firebase Storage."
      - "Provide live real-time PDF canvas preview updating instantly as branding settings change."

  - id: e55-s3
    title: "Web Rendering: Multi-Template PDF Builder (Estimate vs. Tax Invoice)"
    acceptance:
      - "Implement PDF layout templates: Standard GST Invoice, Compact Thermal Receipt, and Estimate / Quotation."
      - "Accurately compute and display line-item CGST/SGST/IGST tax breakdowns, discounts, and final total."
      - "Render auto-generated UPI QR code from store bank details for fast customer payments."

  - id: e55-s4
    title: "Web Actions: Download, Direct Print & WhatsApp/Email Sharing for Sales & Estimates"
    acceptance:
      - "Add 'Generate PDF' and 'Print Invoice' buttons to Sale Detail and Estimate detail views."
      - "Integrate Next.js route /api/pdf/generate to return downloadable PDF blobs."
      - "Provide WhatsApp share trigger pre-filling customer mobile number with PDF link."

