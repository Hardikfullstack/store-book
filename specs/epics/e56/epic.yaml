epic_id: e56
title: "Android: Offline Custom PDF Generation, Thermal / Document Printing & Sharing for Estimates & Invoices"
priority: P1
status: in_progress
target_version: v1.9.0
depends_on: [e01, e02, e55]
type: development
verification_date: "2026-09-17"

description: |
  Introduces native Android offline-first custom PDF generation, thermal receipt (ESC/POS) printing, and document
  sharing for Estimates (Quotations) and Tax Invoices in the StoreBook Android POS app. Store owners can render A4/A5 PDFs
  and 2-inch/3-inch thermal bills locally without internet access, preview documents interactively in Jetpack Compose,
  print to Bluetooth/USB printers, and share directly to customers via WhatsApp or System Share.

scope:
  in:
    - KMP & Data Layer (`shared` & `app/data`):
        - `invoice_settings` table in SQLDelight (`StoreBook.sq`) storing local branding settings, logo cache path, terms, and bank details.
        - Offline-first delta sync in `SyncWorker` for invoice template settings between local SQLite and remote DataConnect.
    - Android PDF & Thermal Printing Engine (`app/src/main/java/com/storebook/inventoryapp/pdf/` & `printing/`):
        - Native Android PDF generator using `android.graphics.pdf.PdfDocument` and Canvas layout engine for A4/A5 documents.
        - ESC/POS Thermal Printing engine for 58mm (2-inch) and 80mm (3-inch) Bluetooth and USB receipt printers.
        - System `PrintManager` integration via custom `PrintDocumentAdapter`.
    - Android Jetpack Compose UI (`app/src/main/java/com/storebook/inventoryapp/ui/pdf/` & `settings/`):
        - `InvoicePdfPreviewScreen` and `EstimatePdfPreviewScreen` rendering native PDF page previews with zoom and page controls.
        - `PdfSettingsScreen` allowing store owners to pick templates, toggle GST breakups, upload logo image from device, and set terms.
        - One-tap quick actions: "Print Thermal", "Print A4", "Share PDF via WhatsApp", and "Download to Device".
  out:
    - Web Dashboard template editor (handled in e55).
    - Custom font file upload beyond system fonts (future enhancement).

architecture:
  android_components:
    - name: "PdfDocumentGenerator"
      package: "com.storebook.inventoryapp.pdf"
      role: "Renders offline A4/A5 PDF documents using android.graphics.pdf.PdfDocument and Android Canvas drawing routines."
    - name: "EscPosPrinterService"
      package: "com.storebook.inventoryapp.printing"
      role: "Formats and dispatches raw ESC/POS commands over Bluetooth/USB to 58mm/80mm thermal receipt printers."
    - name: "InvoicePdfPreviewScreen & EstimatePdfPreviewScreen"
      package: "com.storebook.inventoryapp.ui.pdf"
      role: "Jetpack Compose UI for interactive document preview, printer selection, and direct WhatsApp sharing."
    - name: "PdfSettingsViewModel & InvoiceSettingsRepository"
      package: "com.storebook.inventoryapp.data.repository"
      role: "Manages local PDF template options, logo image caching, and syncing with SQLDelight database."
    - name: "StoreBook.sq (SQLDelight)"
      module: "shared (KMP)"
      file: "shared/src/commonMain/sqldelight/com/storebook/inventoryapp/shared/data/local/StoreBook.sq"
      role: "Defines invoice_settings table schema, store branding fields, and SQL queries."

stories:
  - id: e56-s1
    title: "SQLDelight & KMP: Add Invoice Settings Table, Domain Model & Local Caching"
    acceptance:
      - "Create invoice_settings table in StoreBook.sq with store_id, template_style, logo_path, accent_color, header_text, footer_text, bank_details, and terms."
      - "Implement InvoiceSettingsRepository exposing reactive Flow of settings with local caching."
      - "SyncWorker updated to synchronize invoice template settings between SQLite and DataConnect."

  - id: e56-s2
    title: "Android Native PDF Engine: Offline A4/A5 Document Rendering with Android Canvas"
    acceptance:
      - "Implement PdfDocumentGenerator using android.graphics.pdf.PdfDocument for offline page rendering."
      - "Accurately format header logo, store GSTIN, customer details, line items, CGST/SGST/IGST breakdown, and UPI QR code."
      - "Support document types: Quotation/Estimate vs. Tax Invoice."
      - "Pass JVM/Android unit tests for layout calculation and page rendering."

  - id: e56-s3
    title: "Android Thermal Printing & System PrintManager Integration"
    acceptance:
      - "Implement ESC/POS encoder supporting 58mm (2-inch) and 80mm (3-inch) Bluetooth/USB thermal printers."
      - "Integrate Android PrintManager with custom PrintDocumentAdapter for standard Wi-Fi/USB printing."
      - "Include printer status detection (out of paper, printer disconnected) with friendly user toasts."

  - id: e56-s4
    title: "Android UI: Document Preview Screen, Quick WhatsApp Share & Settings UI"
    acceptance:
      - "Build InvoicePdfPreviewScreen and EstimatePdfPreviewScreen in Jetpack Compose with pinch-to-zoom preview."
      - "Provide quick action bar: 'Share via WhatsApp', 'Print Thermal', 'Print PDF', 'Save File'."
      - "Build PdfSettingsScreen for store owners to configure template style, logo, terms, and printer defaults."
      - "Add Roborazzi snapshot test for PDF preview screen and settings UI."

