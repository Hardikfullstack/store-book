# Epic e13 — Data Layer Integrity Verification: SQLDelight Queries & Schema Correctness

id: e13
title: "Verify All SQLDelight Queries Return Expected Results and Schema Matches Code Models"
scope_feature: ["Data Layer (P0)", "SQLDelight Migration (P0)"]
depends_on_epics: [e02]
target_version: v1.3.1
priority: P0
status: defined

rationale: >
  After completing the Room → SQLDelight migration (RP-A0), every query in StoreBook.sq must be verified
  to produce correct results. Generated DAOs match data models, upserts generate unique local IDs correctly,
  soft-deletes work with is_deleted = true filter, FailedSyncQueue retry logic functions properly. Any
  mismatch between .sq definitions and Kotlin Model classes = silent data corruption.

success_criteria:
  - "Every .sq SELECT query returns results matching expected row count and column types"
  - "Upsert queries generate unique local IDs (MAX(id)+1) without collisions"
  - "is_deleted soft-delete filter present on all list queries — deleted items invisible in default views"
  - "FailedSyncQueue correctly retries expired tokens with proper retry counter logic"

stories:
  - id: e13-s1
    title: "Verify all Item queries return correct schema-aligned results with null safety"
    acceptance:
      - "getItems() returns list of non-deleted items with all columns populated"
      - "getItemsWithDeleted() includes is_deleted = true rows"
      - "searchItems(:query) filters case-insensitive on item name field"

  - id: e13-s2
    title: "Verify Sale and SaleItem queries handle cascading data correctly"
    acceptance:
      - "getSales() returns sale records with associated items via JOIN or separate query"
      - "SaleItem rows contain snapshot sellPrice from time of purchase (not current item price)"

  - id: e13-s3
    title: "Verify FailedSyncQueue retry logic and permanent failure marking"
    acceptance:
      - "Failed items increment retry_count on each failed attempt up to max_retries threshold"
      - "Items exceeding max retries marked as permanently_failed = true with reason code stored"

  - id: e13-s4
    title: "Verify SystemConfiguration and StoreBookConfig queries return correct defaults"
    acceptance:
      - "getAppInfo() returns valid business name, address, GSTIN fields" 
      - "Default taxPercentage loads correctly if not yet configured by user"
