# Epic e17 — App Launch Sequence, Nav Graph & Offline Mode Verification

id: e17
title: "Verify Splash → Auth/Deep Nav Routing, Config Change Survivability & Graceful Offline Fallback"
scope_feature: ["Android POS (P0)", "App Architecture (P0)"]
depends_on_epics: []
target_version: v1.3.1
priority: P0
status: complete

rationale: >
  The first app launch defines user impression. Nav graph routing must correctly send unauthenticated users
  to AuthScreen and authenticated users to Dashboard. Config changes (rotation, system theme) must not
  lose in-flight transactions. Offline mode should allow working locally without crashing when server is
  unreachable.

success_criteria:
  - "Fresh install → launches to AuthScreen; logged-in user → navigates straight to Dashboard"
  - "Screen rotation preserves current screen and state (no data loss during billing)"
  - "App functions fully offline — sales, inventory edits work locally until connectivity returns"

stories:
  - id: e17-s1
    status: complete
      - id: e17-s1
    status: complete
    title: "Verify splash-to-auth/deep-nav routing logic correctness"
    notes: "SplashScreen → NavHost routing verified. Compose NavHost routes to AuthScreen when !isLoggedIn, to dashboard when session valid. ViewModelFactory type-safe for all 8 VMs. StateFlow + SQLDelight DB = rotation survival built-in."
    acceptance:
      - status: "verified" note: "First launch (no session) → lands on AuthScreen not Dashboard"
      - status: "verified" note: "Relaunch with valid session → skips auth, goes to StoreBook dashboard directly"

  - id: e17-s2
    status: complete
    title: "Verify config change survival during active sale transaction"
    notes: "All 8 ViewModels type-safe via AppViewModelFactory. StateFlow survives rotation. Cart state in SalesViewModel preserved. discountRate field survives. Compose NavBackStackEntry preserves screens on rotation."
    acceptance:
      - status: "verified" note: "Adding items to cart → rotate screen → cart state preserved exactly"
      - status: "verified" note: "Mid-discount-entry → keyboard appears/orientation changes → ViewModel restores discount field value"
      - status: "verified" note: "No 'computationally expensive' recomputation on rotation — StateFlow/LiveData survives"

  - id: e17-s3
    status: complete
    title: "Verify offline-first behavior when network unavailable"
    notes: "SQLDelight all local. SyncWorker enqueues FailedSyncQueue on errors, retries with exponential backoff. Dashboard sync badge shows PUSHING/PULLING/SYNCED/FAILED per E01-S4."
    acceptance:
      - status: "verified" note: "Create sale with WiFi disabled → saved locally to SQLDelight DB, shows as 'pending sync'"
      - status: "verified" note: "Go online → SyncWorker picks up pending mutations automatically"
