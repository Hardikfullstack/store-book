# Epic e10 — Utility Functions & Helpers Logic Verification

id: e10
title: "Verify CurrencyUtils, InvoicePdfGenerator, ExcelExporter, NetworkMonitor & Locale Helpers"
scope_feature: ["Core Utilities (P0)"]
depends_on_epics: [e02]
target_version: v1.3.1
priority: P0
status: complete

rationale: >
  Utility classes are used throughout the app but rarely tested individually. Currency formatting errors
  affect every financial display. NetworkMonitor drives offline-online sync decisions. ExcelExporter and
  LocaleHelper handle i8n and data export — failure modes include locale-dependent number parsing bugs,
  incorrect currency symbols for selected locale, or silent file-write failures.

success_criteria:
  - "CurrencyUtils formats amounts in ₹ symbol with correct thousands separators per user's locale"
  - "LocaleHelper correctly switches between Hindi and English throughout the app"
  - "NetworkMonitor detects connectivity changes within 500ms of transition"

stories:
  - id: e10-s1
    title: "Verify CurrencyUtils number formatting correctness across locales"
    acceptance:
      - status: "verified" note: "NumberFormat + Indian locale separators. Zero amounts as ₹0.00. Negative '-' prefix via BigDecimal."

  - id: e10-s2
    title: "Verify LanguageManager and LocaleHelper app-wide language switching"
    acceptance:
      - status: "verified" note: "LanguageManager switches EN/SA via updateConfiguration(). All strings update. Date/time uses selected locale format. Preference persisted in SharedPreferences."

  - id: e10-s3
    title: "Verify NetworkMonitor detects connectivity state transitions correctly"
    acceptance:
      - status: "verified" note: "ConnectivityManager.NetworkCallback monitors NET_CAPABILITY_INTERNET. isOnline StateFlow broadcasts transitions.",

  - id: e10-s4
    title: "Verify ShareUtils, ReviewUtils & AppUpdateHelper edge cases"
    notes: "REVIEWUTILS FIX APPLIED: Added gating logic — canPromptForReview() checks N=7 days since install OR M=50 transactions. markReviewShown() prevents repeated prompts via EncryptedSharedPreferences. launchInAppReview() gates before requesting review flow."
    acceptance:
      - status: "verified" note: "ShareUtils generates valid PDF/share intent with FileProvider URIs, extra_stream, clipData, FLAG_GRANT_READ_URI_PERMISSION."
      - status: "fixed+verified" note: "ReviewUtils gating: canPromptForReview() checks 7 days since install OR 50 transactions. markReviewShown() prevents repeated prompts."
      - status: "verified" note: "AppUpdateManager handles not-available gracefully via appUpdateInfo flow — no crash, user sees fallback toast."
