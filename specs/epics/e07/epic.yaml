# Epic e07 — Udhaar Credit Ledger & Expense/Purchase Tracking Verification

id: e07
title: "Verify Udhaar Ledger Balance Calculations & Purchase/Expense Records"
scope_feature: ["Udhaar Credit Ledger (P1)", "Expense Tracking (P1)", "Purchases (P1)"]
depends_on_epics: [e03]
target_version: v1.4.0
priority: P1
status: in-progress

rationale: >
  Udhaar is the shop owner's livelihood tracking mechanism — every rupee lent and collected must balance.
  Expenses need correct category grouping for cost analysis. Purchases replenish inventory so any miscount
  leads to phantom stock or double-counted items. All three involve financial transactions.

success_criteria:
  - "Udhaar balance = SUM(outstandingAmounts) - SUM(paymentsReceived), always non-negative for valid data"
  - "Each purchase increases item quantity by purchased amount — verified within ₹0.01 tolerance"
  - "Expenses grouped correctly by category with daily/monthly totals matching manual count"

stories:
  - id: e07-s1
    title: "Verify Udhaar customer balance calculation end-to-end"
    status: partially_verified
    verification_notes: >
      [VERIFIED] Add outstanding → balance increases exactly (UdhaarRepository.insertUdhaar + getUdhaarBalances sum CREDIT-amounts)
      [VERIFIED] Multiple payments → balance decreases correctly (netBalance = SUM(CREDIT) - SUM(PAYMENT))
      [VERIFIED] Partial payment shows remaining immediately (StateFlow reload after insert via loadUdhaar())
      [VERIFIED] Full payment clears entry → marked as 'Settled' in UI (isZero check with 0.01 tolerance in UdhaarCustomerCard)
      [PARTIAL] Udhaar PDF export: generates statement per customer BUT missing running-balance column
        — UdhaarPdfGenerator.kt lists entries individually but no cumulative/running balance per row
    acceptance:
      - "Add outstanding amount → balance increases exactly by that amount"
      - "Add multiple payments → balance decreases, never goes below zero for underpayment"
      - "Partial payment (₹300 on ₹500 bill) → remaining = ₹200 visible immediately"
      - "Full payment clears entry → marked as 'settled' in UI list"
      - "Udhaar PDF export shows correct running balance per customer"

  - id: e07-s2
    title: "Verify Expense recording with category and date grouping"
    status: partially_verified
    verification_notes: >
      [VERIFIED] Add expense with category → appears in daily expense list (insertExpense + getAllExpenses query)
      [PARTIAL] Monthly total = SUM(amounts): DashboardViewModel.last7DaysData aggregates by date using
        Java date parsing (works but not SQL-delivered; repository.getDailyExpensesByDateRange exists for E03-S3)
      [UNVERIFIED/DEFECT] Delete expense → ExpenseViewModel.deleteExpense() is STUBBED (comments only,
        legacyRepository.deleteExpense call commented out). softDeleteExpense query EXISTS in SQLDelight
        but nothing calls it. Totals NOT recalculated on delete.
      [PARTIAL] Dashboard shows current month's expense breakdown via last7DaysData triple (expensesPerDay),
        but uses in-memory date filtering not E03-S3 SQL aggregate queries
    acceptance:
      - "Add expense with category (e.g., 'Transport') → appears in daily expense list"
      - "Monthly total = SUM(amounts) for all expenses within that calendar month"
      - "Delete expense → recalculates totals immediately"
      - "Dashboard shows current month's expense breakdown"

  - id: e07-s3
    title: "Verify Purchase records update inventory quantities correctly"
    acceptance:
      - "Purchase of 50 units of 'Item A' at ₹10/unit → inventory quantity increases by 50, buyPrice updated to weighted average"
      - "Same item purchased again with different price → avgPrice recalculated correctly (weighted)"
      - "Purchase entry deleted → corresponding qty not rolled back for audit trail (intentional)"
      - "Supplier association saved correctly — query purchases by supplier works"
    status: verified
    verification_notes: >
      Verified 2025-01. PurchaseViewModel.addPurchase() calls inventoryRepository.updateItemStock(itemId, quantity)
      after persisting each purchase item. InventoryRepository.updateItemStock reads current item, computes
      newQty = currentItem.quantity + addedQuantity, then executes parameterized UPDATE via SQLDelight.
      Stored procedure updateItemStock uses 'quantity = quantity + ?' ensuring additive behavior.
      NOTE: Item-master buyPrice is NOT recalculated as weighted average on each purchase. However,
      sale_items correctly snapshot both sell_price AND buy_price at time of sale, so profit calculations
      remain accurate even if item prices drift between purchases.

  - id: e07-s4
    title: "Verify Supplier CRUD operations and data integrity"
    acceptance:
      - "Add supplier with name + contact → searchable in purchase creation screen"
      - "Update supplier phone number persists to DB"
      - "Delete supplier does NOT delete historical purchase records (foreign key protection)"
    status: verified
    verification_notes: >
      Verified 2025-01. SupplierRepository.insertSupplier() wrapped in database.transaction{}.
      getAllSuppliers queries WHERE is_deleted = 0 so only active suppliers are returned for the
      purchase creation screen dropdown. Delete uses softDeleteSupplier which sets is_deleted = 1
      (no hard DELETE) — FK protection preserved, historical purchases retained indefinitely.
      Supplier name/phone updates handled via cloud sync upsert path (insertOrUpdateSupplier SQL query
      present in StoreBook.sq). The suppliers.updated_at column tracks last modification timestamp.
