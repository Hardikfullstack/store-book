epic_id: e52
title: "Web & DataConnect: Business-Type Scoped Catalog, Multi-Store Category Sharing & Dynamic Dropdown"
priority: P1
status: complete
target_version: v1.9.0
description: |
  Introduces an Industry / Shop-Type Scoped Catalog (`businessType`) architecture in Firebase DataConnect (PostgreSQL)
  and Web Dashboard. Categories are scoped and crowdsourced per `businessType` (e.g. medical, grocery, hardware, electrical)
  rather than individual `storeId`, enabling multi-store businesses and peer merchants across stores to share categorized catalogs.
  Provides mandatory `businessType` selection across 11 approved business verticals during store creation and dynamic category
  management in ItemsClient.tsx.

scope:
  in:
    - DataConnect Schema & Operations:
        - Update `type Category @table` with `businessType: String!` (default "general"), `name: String!`, `isDeleted: Boolean!`, `updatedAt: Float!`.
        - Update `type Store @table` with `businessType: String` (default "general").
        - Add `GetCategories($businessType: String!)` query in `queries.gql` scoped by `businessType`.
        - Add `SyncCategory($id: String!, $businessType: String!, $name: String!, ...)` mutation in `mutations.gql`.
        - Update `SyncStore` mutation to include `$businessType: String`.
    - Web Business Types Central Registry (web/src/lib/businessTypes.ts):
        - Define 11 approved business types: `general`, `medical`, `grocery`, `dairy_sweets`, `bakery`, `footwear`, `electronics`, `hardware`, `electrical`, `stationery`, `cosmetics`.
    - Store Creation & Session (web/src/components/CreateStoreModal.tsx, web/src/lib/session.ts, web/src/app/actions.ts):
        - Required `businessType` dropdown selector in `CreateStoreModal.tsx`.
        - Persist `businessType` during `createStore` action.
        - Load and resolve `businessType` for active store in `getSession()`.
    - Web Creatable Category Dropdown (web/src/app/items/ItemsClient.tsx):
        - Dynamically fetch categories scoped by the active store's `businessType`.
        - On-the-fly category creation saves with `businessType` so all stores in that vertical share the new category.
        - Searchable dropdown with keyboard navigation and dark mode support.
  out:
    - Android native Compose screens and SQLDelight Category migration (scoped for separate future mobile epic).

architecture:
  dataconnect:
    - name: "Category & Store Tables"
      files:
        - "dataconnect/schema/schema.gql"
        - "dataconnect/connector/queries.gql"
        - "dataconnect/connector/mutations.gql"
      role: "Industry/businessType scoped category persistence, store vertical tagging, and retrieval."
  web_components:
    - name: "CreateStoreModal & Session"
      files:
        - "web/src/components/CreateStoreModal.tsx"
        - "web/src/lib/session.ts"
        - "web/src/lib/businessTypes.ts"
        - "web/src/app/actions.ts"
      role: "Store creation with required businessType selection and session vertical resolution."
    - name: "ItemsClient"
      file: "web/src/app/items/ItemsClient.tsx"
      role: "Item management client with vertical-scoped category fetching and on-the-fly creation."

stories:
  - id: e52-s1
    title: "DataConnect: Business-Type Category Schema & Operations"
    acceptance:
      - "Category table defined in schema.gql with businessType column."
      - "Store table updated with businessType column."
      - "GetCategories query filters by businessType and isDeleted = false."
      - "SyncCategory mutation upserts category with businessType."

  - id: e52-s2
    title: "Web: Business Type Central Registry & Store Creation Modal"
    acceptance:
      - "11 approved business types defined in web/src/lib/businessTypes.ts."
      - "CreateStoreModal includes mandatory businessType dropdown."
      - "createStore Server Action persists businessType to database."
      - "session.ts resolves active store's businessType."

  - id: e52-s3
    title: "Web: Dynamic Scoped Category Dropdown in Add/Edit Item Modal"
    acceptance:
      - "ItemsClient fetches categories matching active store's businessType."
      - "Creating a new category tags it with the store's businessType."
      - "All stores with the same businessType share and see new categories."

