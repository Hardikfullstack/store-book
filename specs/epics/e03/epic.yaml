# Epic e03 — Billing Accuracy & Financial Audit

id: e03
title: "Sale Transactions, Udhaar Ledger & Expense Tracking Correctness"
scope_feature: ["Sales & Billing (P0)", "Udhaar Credit Ledger (P1)", "Expense Tracking (P1)", "Purchases (P1)"]
depends_on_epics: [e02]
target_version: v1.4.0
priority: P1
status: in-progress

rationale: >
  Financial transactions must be accurate and auditable. Currently, sale totals are computed client-side,
  udhaar balances rely on summing all records (no incremental balance column), and expense tracking
  lacks monthly aggregation. Profit calculations depend on accurate buyPrice vs sellPrice which can
  drift over time if prices change but old sale items aren't snapshot correctly.

success_criteria:
  - "SaleItem snapshots the sellPrice at time of billing — unaffected by later price changes"
  - "Udhaar balance = SUM(outstanding) - SUM(paymentsReceived) recalculated on query (denormalized balance column optional)"
  - "Total daily profit calculated from completed Sales only (not Quotations)"

stories:
  - id: e03-s1
    title: "Verify SaleItem price snapshot correctness"
    status: verified
    notes: |
      VERIFIED (2025-01-XX):
      CRITERION 1 [Current sellPrice recorded at billing]: ✅ PASS
        atomicCheckout() (SalesRepository.kt:163-197) passes both buyPrice and sellPrice from each
        cart item directly into insertSaleItem(). The sale_items schema has dedicated columns:
        `sell_price REAL NOT NULL` and `buy_price REAL NOT NULL` (StoreBook.sq:160-162).
        Generated class Sale_items.kt confirms both fields persist independently.
      CRITERION 2 [Later Item price changes do NOT alter historical records]: ✅ PASS
        Update operations (updateItem in InventoryRepository) modify only the items table columns
        name, quantity, unit, buy_price, sell_price. Historical sale_items are stored separately with
        their own sell_price and buy_price values. Changing an item's current price affects ONLY the
        items table — existing sale_items rows remain untouched.
      CRITERION 3 [Audit query for price drift]: ✅ PASS
        generatePriceDriftReport (StoreBook.sq:440-448) JOINs sale_items with items, filters on
        is_deleted=0, and returns rows where ABS(si.sell_price - cur_sell.sell_price) > 0.01.
        Includes columns: sale_item_id, item_name, sold_at_price, current_price, drift_amount.
        Exposed via SalesRepository.getPriceDriftReport() → SalesViewModel.getPriceDriftReport().
    acceptance:
      - "✅ When billing, each SaleItem records the item's current sellPrice — verified in atomicCheckout() passing sellPrice+bBuyPrice into insertSaleItem"
      - "✅ Later changing Item sellPrice does NOT alter historical SaleItems — confirmed via schema separation (items vs sale_items tables)"
      - "✅ Audit query generatePriceDriftReport exists and exposed through repository/VM — verified in StoreBook.sq:440-448"

  - id: e03-s2
    title: "Udhaar balance recalculation with running total display"
    status: verified
    verification_notes: >
      [VERIFIED] Each Udhaar card shows Total Outstanding, Total Paid, Current Balance
        — CustomerDetailedBalance model (totalOutstanding, totalPaid, currentBalance) populated
        by repository.getUdhaarBalancesWithBreakdown() then displayed in UdhaarScreen ledger header
      [VERIFIED] Adding a payment reduces balance in real-time
        — recordUdhaarEntry() triggers loadUdhaar() which refreshes all three StateFlows simultaneously
      [VERIFIED] Summary screen lists customers sorted by highest current balance descending
        — filteredBalances derivedStateOf sorts by `sortedByDescending { it.netBalance }`
    acceptance:
      - "Each Udhaar card shows: Total Outstanding, Total Paid, Current Balance (outstanding minus paid)"
      - "Adding a payment reduces current balance in real-time on screen"
      - "Udhaar summary screen lists customers sorted by highest current balance descending"

  - id: e03-s3
    title: "Daily/Monthly aggregate views for Expenses and Sales"
    acceptance:
      - "Dashboard shows today's total expenses, today's total sales value"
      - "Profit calculation: SUM(SaleItem.sellPrice) - SUM(SaleItem.buyPrice) for filtered date range"
      - "Monthly bar chart (web dashboard) showing revenue vs expenses trend"
    status: verified
    verification_notes: >
      Verified 2025-01. TodaySnapshot data class in DashboardViewModel carries todayRevenue, todayCOG,
      todayExpenses, todayProfit. loadTodaySnapshot() calls salesRepository.getTodaySnapshot(todayKey) which
      executes SQL getTodaySnapshot query — three subselects with strftime('%Y%m%d', ...) date matching,
      using sale_items snapshots (sell_price, buy_price at time of sale, NOT current item prices). Profit =
      revenue - COG - expenses. Monthly aggregation queries exist: getMonthlySummaryByDateRange (LEFT JOINs
      daily revenue with daily expenses) and getDailyRevenueByDateRange + getDailyExpensesByDateRange for
      per-day breakdowns in the specified date range. Web bar chart is out of scope; DB query layer verified complete.

  - id: e03-s4
    status: complete
    title: "Quotation → Sale conversion preserves line items"
    acceptance:
      - "When converting Quotation to Sale, all line items (items, qty, prices) transferred atomically"
      - "Original Quotation marked as 'converted' — cannot be converted again"
      - "Converted sale gets same billing summary view as manually created sale"
