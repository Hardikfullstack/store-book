type Item @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  storeId: String! @col(name: "store_id")
  name: String!
  quantity: Float!
  unit: String!
  buyPrice: Float!
  sellPrice: Float!
  lowStockThreshold: Float!
  category: String!
  photoPath: String
  hsnCode: String
  taxRate: Float
  batchLotNumber: String
  expiryDate: String
  
  # Sync Columns
  isDeleted: Boolean! @default(value: false) @col(name: "is_deleted")
  updatedAt: Float! @col(name: "updated_at")
}

type Sale @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  storeId: String! @col(name: "store_id")
  timestamp: Float!
  totalAmount: Float!
  discountAmount: Float!
  customerName: String
  customerGstin: String
  businessGstin: String
  customerAddress: String
  businessAddress: String
  type: String! @default(value: "SALE")
  notes: String
  
  # Sync Columns
  isDeleted: Boolean! @default(value: false) @col(name: "is_deleted")
  updatedAt: Float! @col(name: "updated_at")
}

type SaleItemDetail @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  storeId: String! @col(name: "store_id")
  saleId: String! @col(name: "sale_id")
  itemId: String! @col(name: "item_id")
  itemName: String!
  quantity: Float!
  unit: String!
  sellPrice: Float!
  buyPrice: Float!
  
  sale: Sale! @ref
  item: Item! @ref
  
  # Sync Columns
  isDeleted: Boolean! @default(value: false) @col(name: "is_deleted")
  updatedAt: Float! @col(name: "updated_at")
}

type UdhaarEntry @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  storeId: String! @col(name: "store_id")
  customerName: String!
  amount: Float!
  type: String!
  timestamp: Float!
  notes: String
  
  # Sync Columns
  isDeleted: Boolean! @default(value: false) @col(name: "is_deleted")
  updatedAt: Float! @col(name: "updated_at")
}

type ExpenseEntry @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  storeId: String! @col(name: "store_id")
  type: String!
  description: String!
  amount: Float!
  timestamp: Float!
  supplierName: String
  supplierPhone: String
  
  # Sync Columns
  isDeleted: Boolean! @default(value: false) @col(name: "is_deleted")
  updatedAt: Float! @col(name: "updated_at")
}

type Supplier @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  storeId: String! @col(name: "store_id")
  name: String!
  phone: String
  gstin: String
  address: String
  
  # Sync Columns
  isDeleted: Boolean! @default(value: false) @col(name: "is_deleted")
  updatedAt: Float! @col(name: "updated_at")
}

type Purchase @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  storeId: String! @col(name: "store_id")
  supplierId: String! @col(name: "supplier_id")
  supplierName: String!
  totalAmount: Float!
  taxAmount: Float! @default(value: 0.0)
  type: String! @default(value: "BILL")
  timestamp: Float!
  notes: String
  
  # Sync Columns
  isDeleted: Boolean! @default(value: false) @col(name: "is_deleted")
  updatedAt: Float! @col(name: "updated_at")
}

type PurchaseItemDetail @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  storeId: String! @col(name: "store_id")
  purchaseId: String! @col(name: "purchase_id")
  itemId: String! @col(name: "item_id")
  itemName: String!
  quantity: Float!
  unit: String!
  buyPrice: Float!
  
  purchase: Purchase! @ref
  item: Item! @ref
  
  # Sync Columns
  isDeleted: Boolean! @default(value: false) @col(name: "is_deleted")
  updatedAt: Float! @col(name: "updated_at")
}

type ItemBatch @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  storeId: String! @col(name: "store_id")
  itemId: String! @col(name: "item_id")
  batchNumber: String
  expiryDate: Float
  quantity: Float!
  costPrice: Float!
  timestamp: Float!
  notes: String
  
  item: Item! @ref
  
  # Sync Columns
  isDeleted: Boolean! @default(value: false) @col(name: "is_deleted")
  updatedAt: Float! @col(name: "updated_at")
}

type User @table {
  id: String! @col(name: "id")
  phoneNumber: String
  username: String
  createdAt: Float!
  role: String! @default(value: "owner")
  stores: [String]
  storeId: String
  ownerId: String
  canViewProfit: Boolean @default(value: false)
  canDelete: Boolean @default(value: false)
  subscriptionStatus: String @col(name: "subscription_status")
  subscriptionPlan: String @col(name: "subscription_plan")
  subscriptionExpiresAt: Float @col(name: "subscription_expires_at")
  subscriptionPlatform: String @col(name: "subscription_platform")
  subscriptionId: String @col(name: "subscription_id")
}

type Store @table {
  id: String! @col(name: "id")
  name: String
  isActive: Boolean @col(name: "is_active") @default(value: true)
  isPremium: Boolean @col(name: "is_premium")
  subscriptionExpiresAt: Float @col(name: "subscription_expires_at")
  subscriptionPlatform: String @col(name: "subscription_platform")
  subscriptionId: String @col(name: "subscription_id")
  subscriptionStatus: String @col(name: "subscription_status")
}

type GlobalSetting @table {
  id: String! @col(name: "id")
  key: String! @unique
  value: String!
  description: String
  updatedAt: Float! @col(name: "updated_at")
  updatedBy: String @col(name: "updated_by")
}

type AdminAuditLog @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  adminId: String! @col(name: "admin_id")
  adminUsername: String
  action: String!
  targetId: String
  details: String
  timestamp: Float!
}

type Announcement @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  title: String!
  message: String!
  type: String! @default(value: "info") # info, warning, critical
  isActive: Boolean! @col(name: "is_active") @default(value: true)
  createdAt: Float! @col(name: "created_at")
}

type PromoCode @table {
  id: String! @col(name: "id")
  code: String! @unique
  discountPercent: Float @col(name: "discount_percent")
  discountAmount: Float @col(name: "discount_amount")
  maxUses: Float @col(name: "max_uses")
  currentUses: Float @col(name: "current_uses") @default(value: 0)
  expiresAt: Float @col(name: "expires_at")
  isActive: Boolean! @col(name: "is_active") @default(value: true)
}

type StockAdjustment @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  storeId: String! @col(name: "store_id")
  itemId: String! @col(name: "item_id")
  itemName: String! @col(name: "item_name")
  reason: String!
  delta: Float!
  timestamp: Float!
  isDeleted: Boolean! @default(value: false) @col(name: "is_deleted")
  updatedAt: Float! @col(name: "updated_at")
}
