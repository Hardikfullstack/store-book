# -----------------------------------------
# SYNC MUTATIONS (Push from Offline)
# -----------------------------------------

# Synchronize a single item (Insert or Update on Conflict)
mutation SyncItem(
  $id: String!
  $storeId: String!
  $name: String!
  $quantity: Float!
  $unit: String!
  $buyPrice: Float!
  $sellPrice: Float!
  $lowStockThreshold: Float!
  $category: String!
  $photoPath: String
  $hsnCode: String
  $taxRate: Float
  $batchLotNumber: String
  $expiryDate: String
  $isDeleted: Boolean!
  $updatedAt: Float!
) @auth(level: USER) {
  item_upsert(data: {
    id: $id
    storeId: $storeId
    name: $name
    quantity: $quantity
    unit: $unit
    buyPrice: $buyPrice
    sellPrice: $sellPrice
    lowStockThreshold: $lowStockThreshold
    category: $category
    photoPath: $photoPath
    hsnCode: $hsnCode
    taxRate: $taxRate
    batchLotNumber: $batchLotNumber
    expiryDate: $expiryDate
    isDeleted: $isDeleted
    updatedAt: $updatedAt
  })
}

# Synchronize a single sale
mutation SyncSale(
  $id: String!
  $storeId: String!
  $timestamp: Float!
  $totalAmount: Float!
  $discountAmount: Float!
  $customerName: String
  $customerGstin: String
  $businessGstin: String
  $customerAddress: String
  $businessAddress: String
  $type: String!
  $notes: String
  $isDeleted: Boolean!
  $updatedAt: Float!
) @auth(level: USER) {
  sale_upsert(data: {
    id: $id
    storeId: $storeId
    timestamp: $timestamp
    totalAmount: $totalAmount
    discountAmount: $discountAmount
    customerName: $customerName
    customerGstin: $customerGstin
    businessGstin: $businessGstin
    customerAddress: $customerAddress
    businessAddress: $businessAddress
    type: $type
    notes: $notes
    isDeleted: $isDeleted
    updatedAt: $updatedAt
  })
}

# Synchronize a single sale item
mutation SyncSaleItem(
  $id: String!
  $storeId: String!
  $saleId: String!
  $itemId: String!
  $itemName: String!
  $unit: String!
  $quantity: Float!
  $sellPrice: Float!
  $buyPrice: Float!
  $isDeleted: Boolean!
  $updatedAt: Float!
) @auth(level: USER) {
  saleItemDetail_upsert(data: {
    id: $id
    storeId: $storeId
    saleId: $saleId
    itemId: $itemId
    itemName: $itemName
    unit: $unit
    quantity: $quantity
    sellPrice: $sellPrice
    buyPrice: $buyPrice
    isDeleted: $isDeleted
    updatedAt: $updatedAt
  })
}

# -----------------------------------------
# SOFT DELETE MUTATIONS
# -----------------------------------------

# Mark an item as deleted (tombstone)
mutation SoftDeleteItem($id: String!, $updatedAt: Float!) @auth(level: USER) {
  item_update(id: $id, data: { isDeleted: true, updatedAt: $updatedAt })
}

# Mark a sale as deleted
mutation SoftDeleteSale($id: String!, $updatedAt: Float!) @auth(level: USER) {
  sale_update(id: $id, data: { isDeleted: true, updatedAt: $updatedAt })
}

mutation SyncUser(
  $id: String!
  $phoneNumber: String
  $username: String
  $createdAt: Float!
  $role: String!
  $stores: [String!]
  $storeId: String
  $ownerId: String
  $subscriptionStatus: String
  $subscriptionPlan: String
  $subscriptionExpiresAt: Float
  $subscriptionPlatform: String
  $subscriptionId: String
) @auth(level: PUBLIC) {
  user_upsert(data: {
    id: $id
    phoneNumber: $phoneNumber
    username: $username
    createdAt: $createdAt
    role: $role
    stores: $stores
    storeId: $storeId
    ownerId: $ownerId
    subscriptionStatus: $subscriptionStatus
    subscriptionPlan: $subscriptionPlan
    subscriptionExpiresAt: $subscriptionExpiresAt
    subscriptionPlatform: $subscriptionPlatform
    subscriptionId: $subscriptionId
  })
}

mutation UpdateUser(
  $id: String!
  $subscriptionStatus: String
  $subscriptionPlan: String
  $subscriptionExpiresAt: Float
  $subscriptionPlatform: String
  $subscriptionId: String
) @auth(level: USER) {
  user_update(id: $id, data: {
    subscriptionStatus: $subscriptionStatus
    subscriptionPlan: $subscriptionPlan
    subscriptionExpiresAt: $subscriptionExpiresAt
    subscriptionPlatform: $subscriptionPlatform
    subscriptionId: $subscriptionId
  })
}

