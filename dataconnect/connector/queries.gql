# -----------------------------------------
# DELTA SYNC QUERIES (High-Water Mark)
# -----------------------------------------

# Pull updated items since last sync
query SyncItems($storeId: String!, $lastSync: Float!) @auth(level: USER) {
  items(where: { storeId: { eq: $storeId }, updatedAt: { gt: $lastSync } }) {
    id
    name
    quantity
    unit
    buyPrice
    sellPrice
    lowStockThreshold
    category
    photoPath
    hsnCode
    isDeleted
    updatedAt
  }
}

# Pull updated sales since last sync
query SyncSales($storeId: String!, $lastSync: Float!) @auth(level: USER) {
  sales(where: { storeId: { eq: $storeId }, updatedAt: { gt: $lastSync } }) {
    id
    timestamp
    totalAmount
    discountAmount
    customerName
    customerGstin
    businessGstin
    customerAddress
    businessAddress
    type
    notes
    isDeleted
    updatedAt
  }
}

# Pull updated sale items since last sync
query SyncSaleItems($storeId: String!, $lastSync: Float!) @auth(level: USER) {
  saleItemDetails(where: { storeId: { eq: $storeId }, updatedAt: { gt: $lastSync } }) {
    id
    saleId
    itemId
    itemName
    quantity
    unit
    sellPrice
    buyPrice
    isDeleted
    updatedAt
  }
}

# -----------------------------------------
# STANDARD QUERIES (Fallback/Debugging)
# -----------------------------------------



# Paginated active items with total count
query GetActiveItems($storeId: String!, $limit: Int, $offset: Int) @auth(level: USER) {
  items(
    where: { storeId: { eq: $storeId }, isDeleted: { eq: false } }
    limit: $limit
    offset: $offset
    orderBy: { updatedAt: DESC }
  ) {
    id
    name
    quantity
    unit
    buyPrice
    sellPrice
    lowStockThreshold
    category
    photoPath
    hsnCode
    isDeleted
    updatedAt
  }
  items_aggregate(where: { storeId: { eq: $storeId }, isDeleted: { eq: false } }) {
    _count
  }
}

