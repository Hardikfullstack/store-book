# -----------------------------------------
# DELTA SYNC QUERIES (High-Water Mark)
# -----------------------------------------

# Pull updated items since last sync
query SyncItems($storeId: String!, $lastSync: Float!) @auth(level: USER) {
  items(where: { storeId: { eq: $storeId }, updatedAt: { gt: $lastSync } }) {
    id
    name
    quantity
    unit
    buyPrice
    sellPrice
    lowStockThreshold
    category
    photoPath
    hsnCode
    isDeleted
    updatedAt
  }
}

# Pull updated sales since last sync
query SyncSales($storeId: String!, $lastSync: Float!) @auth(level: USER) {
  sales(where: { storeId: { eq: $storeId }, updatedAt: { gt: $lastSync } }) {
    id
    timestamp
    totalAmount
    discountAmount
    customerName
    customerGstin
    businessGstin
    customerAddress
    businessAddress
    type
    isDeleted
    updatedAt
  }
}

# Pull updated sale items since last sync
query SyncSaleItems($storeId: String!, $lastSync: Float!) @auth(level: USER) {
  saleItemDetails(where: { storeId: { eq: $storeId }, updatedAt: { gt: $lastSync } }) {
    id
    saleId
    itemId
    itemName
    quantity
    unit
    sellPrice
    buyPrice
    isDeleted
    updatedAt
  }
}

# -----------------------------------------
# STANDARD QUERIES (Fallback/Debugging)
# -----------------------------------------

# Get all active items directly (Server-side filtering)
query GetActiveItems($storeId: String!) @auth(level: USER) {
  items(where: { storeId: { eq: $storeId }, isDeleted: { eq: false }, quantity: { gt: 0 } }) {
    id
    name
    quantity
    sellPrice
    buyPrice
    category
  }
}

# Pull updated udhaar since last sync
query SyncUdhaars($storeId: String!, $lastSync: Float!) @auth(level: USER) {
  udhaarEntries(where: { storeId: { eq: $storeId }, updatedAt: { gt: $lastSync } }) {
    id
    storeId
    customerName
    amount
    type
    timestamp
    notes
    isDeleted
    updatedAt
  }
}

