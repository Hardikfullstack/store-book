# -----------------------------------------
# DELTA SYNC QUERIES (High-Water Mark)
# -----------------------------------------

# Pull updated items since last sync
query SyncItems($storeId: String!, $lastSync: Float!) @auth(level: USER) {
  items(where: { storeId: { eq: $storeId }, updatedAt: { gt: $lastSync } }, limit: 10000) {
    id
    name
    quantity
    unit
    buyPrice
    sellPrice
    lowStockThreshold
    category
    photoPath
    hsnCode
    isDeleted
    updatedAt
  }
}

# Pull updated sales since last sync
query SyncSales($storeId: String!, $lastSync: Float!) @auth(level: USER) {
  sales(where: { storeId: { eq: $storeId }, updatedAt: { gt: $lastSync } }, limit: 10000) {
    id
    timestamp
    totalAmount
    discountAmount
    customerName
    customerGstin
    businessGstin
    customerAddress
    businessAddress
    type
    notes
    isDeleted
    updatedAt
  }
}

# Pull updated sale items since last sync
query SyncSaleItems($storeId: String!, $lastSync: Float!) @auth(level: USER) {
  saleItemDetails(where: { storeId: { eq: $storeId }, updatedAt: { gt: $lastSync } }, limit: 10000) {
    id
    saleId
    itemId
    itemName
    quantity
    unit
    sellPrice
    buyPrice
    isDeleted
    updatedAt
  }
}

# -----------------------------------------
# STANDARD QUERIES (Fallback/Debugging)
# -----------------------------------------



# Paginated active items with total count
query GetActiveItems(
  $storeId: String!
  $limit: Int
  $offset: Int
  $searchTerm: String
  $minPrice: Float
  $maxPrice: Float
  $orderByName: OrderDirection
  $orderByQuantity: OrderDirection
  $orderByBuyPrice: OrderDirection
  $orderBySellPrice: OrderDirection
  $orderByCategory: OrderDirection
  $orderByUpdatedAt: OrderDirection
) @auth(level: USER) {
  items(
    where: {
      _and: [
        { storeId: { eq: $storeId } },
        { isDeleted: { eq: false } },
        { sellPrice: { ge: $minPrice, le: $maxPrice } },
        {
          _or: [
            { name: { contains: $searchTerm } },
            { category: { contains: $searchTerm } }
          ]
        }
      ]
    }
    limit: $limit
    offset: $offset
    orderBy: [
      { name: $orderByName }
      { quantity: $orderByQuantity }
      { buyPrice: $orderByBuyPrice }
      { sellPrice: $orderBySellPrice }
      { category: $orderByCategory }
      { updatedAt: $orderByUpdatedAt }
    ]
  ) {
    id
    name
    quantity
    unit
    buyPrice
    sellPrice
    lowStockThreshold
    category
    photoPath
    hsnCode
    isDeleted
    updatedAt
  }
}

