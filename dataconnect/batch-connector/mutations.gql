# -------------------------------------------------------------
# BATCH MUTATIONS CONNECTOR (Direct Batch Execution / No Codegen)
# Used by Android DailyBatchWorker (11:00 PM Sync) & Bulk Ops
# -------------------------------------------------------------

# 1. Batch upsert categories
mutation SyncCategoriesBatch(
  $data: [Category_Data!]! @allow(fields: "id businessType storeId name isDefault isDeleted updatedAt")
) @auth(level: USER, insecureReason: "Batch sync categories") {
  category_upsertMany(data: $data)
}

