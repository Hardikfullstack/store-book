# 19. Bulk soft-delete items
mutation SoftDeleteItemsBatch(
  $ids: [String!]!
  $storeId: String!
  $updatedAt: Float!
) @auth(level: USER, insecureReason: "Bulk soft delete items") {
  item_updateMany(where: { id: { in: $ids }, storeId: { eq: $storeId } }, data: { isDeleted: true, updatedAt: $updatedAt })
}

